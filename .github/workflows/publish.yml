name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version and determine npm tag
        id: tag
        run: node scripts/release-metadata.cjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Packed consumer release gate
        run: |
          node scripts/consumer-smoke.mjs pnpm 11.0.0 typescript
          node scripts/consumer-smoke.mjs pnpm 12 typescript
          node scripts/consumer-smoke.mjs npm bundled typescript

      - name: Publish (dry run)
        if: ${{ inputs.dry-run == true }}
        run: npm publish --tag "$NPM_DIST_TAG" --access public --dry-run
        env:
          NPM_DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: ${{ inputs.dry-run != true }}
        run: npm publish --tag "$NPM_DIST_TAG" --provenance --access public
        env:
          NPM_DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        env:
          DRY_RUN: ${{ inputs.dry-run || false }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          NPM_DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "## 📦 npm publish dry run (not published)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 📦 Published to npm" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package:** swallowkit" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** $NPM_DIST_TAG" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" != "true" ]; then
            echo "- **Provenance:** ✅" >> "$GITHUB_STEP_SUMMARY"
          fi
