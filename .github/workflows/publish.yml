name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version and determine npm tag
        id: tag
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./package.json');
          const lock = require('./package-lock.json');
          if (lock.version !== version || lock.packages[''].version !== version) {
            throw new Error('package.json and package-lock.json versions must match');
          }
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Git tag must match package.json version');
          }
          const distTag = version.includes('-') ? 'next' : 'latest';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ndist_tag=${distTag}\n`);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Packed consumer release gate
        run: |
          node scripts/consumer-smoke.mjs pnpm 11.0.0 typescript
          node scripts/consumer-smoke.mjs pnpm 12 typescript
          node scripts/consumer-smoke.mjs npm bundled typescript

      - name: Publish (dry run)
        if: ${{ github.event.inputs.dry-run == 'true' }}
        run: npm publish --tag ${{ steps.tag.outputs.dist_tag }} --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: ${{ github.event.inputs.dry-run != 'true' }}
        run: npm publish --tag ${{ steps.tag.outputs.dist_tag }} --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: ${{ github.event.inputs.dry-run != 'true' }}
        run: |
          echo "## 📦 Published to npm" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package:** swallowkit" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${{ steps.tag.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** ${{ steps.tag.outputs.dist_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Provenance:** ✅" >> "$GITHUB_STEP_SUMMARY"
