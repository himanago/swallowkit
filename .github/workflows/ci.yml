name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  consumer-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { manager: pnpm, version: '11.0.0', backend: typescript, node: 22 }
          - { manager: pnpm, version: '12', backend: typescript, node: 24 }
          - { manager: npm, version: '10', backend: typescript, node: 22 }
          - { manager: pnpm, version: '11', backend: csharp, node: 22 }
          - { manager: pnpm, version: '12', backend: python, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/consumer-smoke.mjs ${{ matrix.manager }} ${{ matrix.version }} ${{ matrix.backend }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-${{ matrix.manager }}-${{ matrix.version }}-${{ matrix.backend }}
          path: |
            /tmp/swallowkit-consumer-*/*.log
            /tmp/swallowkit-consumer-*/dependency-audit.json
